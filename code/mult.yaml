rule mult_model7:
  input:
    script = mam+'code/nklimko/model_7.R',
    model = mam+'data/nklimko/grm10.rds',
    data = mam+'data/data3_20250514.rds',
    eigen = mam+'data/filtered_chr/pca_for_{grm}.rds',
    env = mam+'data/E_eigen.rds',
    pcs = mam+'data/scaled_pcs_plink.rds',
    gxe_eigen= mam+'data/eigen_GxE_{grm}.rds',
  output:
    fit =     mam+'output/model7/{traitor}/{grm}/fit.rds',
    varcomp = mam+'output/model7/{traitor}/{grm}/varcomp.csv',
  params:
    scratch= scratch+'mult/{traitor}/{grm}/model7/dart_'
  resources:
    # original 10 cores with 150gb total
    tasks=30,
    mem_mb_per_cpu=5000,
    time_min=3000
    # 50 hour time limit is the frightening part
  shell:
    """
    source /opt/intel/oneapi/mkl/2023.2.0/env/vars.sh intel64
    module load R/4.2.3
    export MKL_NUM_THREADS={resources.tasks}
    export OMP_NUM_THREADS={resources.tasks}

    Rscript {input.script} \
    --trait {wildcards.traitor} \
    --modelpath {input.model} \
    --datapath {input.data} \
    --eigenpath {input.eigen} \
    --gxe_eigenpath {input.gxe_eigen} \
    --pcpath {input.pcs} \
    --envpath {input.env} \
    --outpath {output.fit} \
    --varpath {output.varcomp} \
    --scratch {params.scratch}
    """


