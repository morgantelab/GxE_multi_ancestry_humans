### Overview ---------------------------------------------------------------------

# The following code is my logic controller in the form of a massive rule all statement. Block specific breakdown:

# Global parameters - Manually defined wildcard values applicable to one or many rule modules. Confirm definitions do not override rule-specific wildcards.

# - Directories - Syntax shortcut for hotspot directories, including the project root, scratch folder, external data paths, and auxillary log files

# - Constraints - Prevents rescursive wildcard issues and ensures proper rule flow. Generally, wildcards do not contain underscores to allow separation by underscores from other rules. Otherwise, wildcards serve as directory names to sort rule outputs intuitively.

# - Wildcards - Manually defined wildcard values applicable to one or many rule modules. Confirm definitions do not override rule-specific wildcards.

# Modules - Contains analysis specific rule sets and analysis-specific wildcards.

# The Rule - This rule contains active outputs from all module files. Disabled inputs are commented out.

# Rule storage - Housekeeping rules and other code that doesn't affect core analyses.

